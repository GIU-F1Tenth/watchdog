watchdog_node:
    ros__parameters:
        # Voltage thresholds
        critical_voltage: 12.0
        min_voltage: 9.0
        max_voltage: 52.0

        # Temperature thresholds (Celsius)
        temp_warning_start: 80.0
        temp_warning_high: 90.0
        temp_critical: 100.0

        # Timeout settings (seconds)
        lidar_timeout: 0.5
        camera_timeout: 0.5
        lidar_critical_timeout: 1.0

        # Timer intervals (seconds)
        status_publish_interval: 1.0
        camera_check_interval: 0.5
        critical_check_interval: 0.5

        # Topic names
        core_topic: "/sensors/core"
        camera_topic: "/camera/camera/color/image_raw"
        lidar_topic: "/scan"
        odom_topic: "/odom"
        critical_topic: "/tmp/watchdog/critical"
        status_topic: "/watchdog/system/status"
        camera_status_topic: "/tmp/watchdog/camera_is_live"

        # QoS settings
        subscription_qos_depth: 10
        publisher_qos_depth: 10

        # Logging settings
        node_name: "watchdog_node"
        log_level: "INFO" # DEBUG, INFO, WARN, ERROR, FATAL

        # ===== SANITY CHECK CONFIGURATION =====
        
        # Global Sanity Check Settings
        sanity_checks_enabled: true
        sanity_check_interval: 0.1  # seconds between sanity checks
        warning_history_size: 100   # number of warnings to keep in memory
        health_update_interval: 1.0 # seconds between health score updates

        # LiDAR Sanity Checks
        lidar_sanity_enabled: true
        lidar_min_range: 0.08        # minimum valid range (meters)
        lidar_max_range: 30.0        # maximum valid range (meters)
        lidar_noise_threshold: 0.05  # maximum acceptable noise level
        lidar_max_consecutive_invalid: 5    # max consecutive invalid readings
        lidar_dead_zone_threshold: 10       # consecutive invalid points = dead zone
        lidar_jump_threshold: 2.0           # max change between consecutive readings (meters)
        lidar_intensity_min: 0.0            # minimum intensity value (if available)
        lidar_intensity_max: 255.0          # maximum intensity value (if available)

        # Camera Sanity Checks  
        camera_sanity_enabled: true
        camera_min_brightness: 15           # minimum average brightness
        camera_max_brightness: 240          # maximum average brightness
        camera_blur_threshold: 100.0        # blur detection threshold (variance of Laplacian)
        camera_noise_threshold: 0.1         # maximum acceptable noise level
        camera_min_width: 320               # minimum expected image width
        camera_min_height: 240              # minimum expected image height
        camera_max_timestamp_gap: 0.2       # max gap between frames (seconds)

        # Battery/VESC Sanity Checks
        battery_sanity_enabled: true
        battery_max_voltage_change_rate: 1.0  # V/s - max voltage change rate
        battery_trend_window_size: 10         # number of samples for trend analysis
        battery_spike_threshold: 2.0          # voltage change considered a spike (V)
        motor_temp_rate_threshold: 5.0        # °C/s - max temperature change rate
        motor_current_max: 50.0               # maximum motor current (A)
        motor_current_spike_threshold: 10.0   # current change considered a spike (A)

        # Odometry Sanity Checks
        odom_sanity_enabled: true
        max_linear_velocity: 10.0      # m/s - maximum believable linear velocity
        max_angular_velocity: 5.0      # rad/s - maximum believable angular velocity  
        max_linear_acceleration: 8.0   # m/s² - maximum believable linear acceleration
        max_angular_acceleration: 10.0 # rad/s² - maximum believable angular acceleration
        odom_velocity_smoothing_window: 5     # number of samples for smoothing
        odom_position_jump_threshold: 1.0     # maximum position jump (meters)

        # Cross-Sensor Validation
        cross_sensor_validation_enabled: true
        lidar_camera_correlation_threshold: 0.8    # minimum correlation between LiDAR and camera depths
        odometry_visual_odometry_threshold: 0.2    # max velocity difference (m/s) between wheel and visual odometry
        position_consistency_threshold: 0.5        # max position difference (meters) across position sources
        temporal_sync_threshold: 0.1               # max time difference for synchronized data (seconds)
        environment_consistency_window: 10         # number of samples for environmental consistency check
        depth_correlation_threshold: 0.3           # correlation threshold for LiDAR/camera depth
        velocity_correlation_threshold: 0.2        # correlation threshold for different velocity sources
        sensor_timestamp_sync_threshold: 0.1       # max time difference for synchronized data (seconds)
        environmental_consistency_enabled: true

        # Advanced Validation Settings
        statistical_validation_enabled: true
        moving_average_window_size: 20        # samples for moving average calculations
        outlier_detection_sigma: 2.0          # standard deviations for outlier detection
        trend_analysis_enabled: true
        prediction_validation_enabled: false  # enable predictive validation (experimental)

        # Sanity Check Topics
        sanity_warnings_topic: "/watchdog/sanity_warnings"
        sensor_health_topic: "/watchdog/sensor_health" 
        sanity_summary_topic: "/watchdog/sanity_summary"
