# F1TENTH Watchdog Configuration
# Optimized for F1TENTH autonomous racing vehicle integration

watchdog:
  ros__parameters:
    # F1TENTH Vehicle Specifications
    vehicle_type: "f1tenth"
    max_speed: 8.0  # m/s - typical F1TENTH max speed
    wheelbase: 0.33  # m - F1TENTH wheelbase
    
    # Core Monitoring Parameters (F1TENTH optimized)
    critical_voltage: 12.2  # V - Conservative for racing safety
    low_voltage_threshold: 12.8  # V - Warning threshold
    very_low_voltage: 11.8  # V - Emergency stop
    temp_warning_start: 75.0  # C - Lower for racing conditions
    temp_warning_stop: 70.0  # C - Hysteresis
    temp_critical: 85.0  # C - Critical for motors
    temp_emergency: 90.0  # C - Emergency stop
    
    # F1TENTH Sensor Timeouts
    lidar_timeout: 0.2  # s - Tight for racing
    camera_timeout: 0.3  # s - Camera less critical
    odom_timeout: 0.1  # s - Critical for control
    sensor_timeout: 0.5  # s - General sensors
    imu_timeout: 0.1  # s - Critical for control
    
    # Sanity Checking Configuration
    sanity_check_enabled: true
    sanity_check_frequency: 10.0  # Hz - High frequency for racing
    sanity_check_buffer_size: 30  # Smaller buffer for responsiveness
    
    # Battery Validation (F1TENTH LiPo battery)
    battery_validation_enabled: true
    battery_voltage_min: 11.5  # V - 3S LiPo minimum
    battery_voltage_max: 12.6  # V - 3S LiPo maximum
    battery_voltage_rate_limit: 0.8  # V/s - Racing conditions
    battery_current_max: 40.0  # A - F1TENTH motor limits
    battery_consistency_window: 8  # Samples
    
    # LiDAR Validation (Hokuyo UST-10LX typical)
    lidar_validation_enabled: true
    lidar_range_min: 0.06  # m - Hokuyo spec
    lidar_range_max: 10.0  # m - Indoor racing environment
    lidar_angle_min: -2.35619  # rad - 135 degrees
    lidar_angle_max: 2.35619  # rad - 135 degrees
    lidar_noise_threshold: 0.08  # Tighter for racing
    lidar_dropout_threshold: 0.03  # Lower tolerance
    lidar_consistency_window: 3  # Faster response
    
    # Camera Validation (Intel RealSense typical)
    camera_validation_enabled: true
    camera_brightness_threshold: 40  # Lower for varied lighting
    camera_contrast_threshold: 15  # Adjusted for racing environments
    camera_blur_threshold: 80.0  # Stricter for high-speed
    camera_noise_threshold: 25.0  # Racing environment
    camera_consistency_window: 5  # Responsive
    
    # Odometry Validation (F1TENTH dynamics)
    odometry_validation_enabled: true
    odometry_velocity_max: 8.5  # m/s - Slightly above max for safety margin
    odometry_angular_velocity_max: 6.0  # rad/s - F1TENTH turning capability
    odometry_acceleration_max: 12.0  # m/s^2 - Racing acceleration
    odometry_jerk_threshold: 40.0  # m/s^3 - Aggressive but controlled
    odometry_consistency_window: 5  # Fast response
    
    # Cross-Sensor Validation (F1TENTH multi-sensor setup)
    cross_sensor_validation_enabled: true
    lidar_camera_correlation_threshold: 0.75  # Relaxed for racing conditions
    odometry_visual_odometry_threshold: 0.3  # m - Higher tolerance for speed
    position_consistency_threshold: 0.4  # m - Racing tolerances
    temporal_sync_threshold: 0.08  # s - Tight synchronization
    environment_consistency_window: 8  # Samples
    cross_sensor_buffer_size: 25  # Optimized size
    
    # F1TENTH Specific Validations
    steering_angle_max: 0.5  # rad - ~28 degrees max steering
    steering_rate_max: 3.0  # rad/s - Maximum steering rate
    track_width_expected: 1.2  # m - Typical F1TENTH track width
    
    # Racing Mode Parameters
    racing_mode: true  # Enable racing-specific validations
    track_type: "indoor"  # indoor, outdoor, mixed
    safety_margin: 1.2  # Multiplier for safety thresholds
    
    # Emergency Response
    emergency_stop_enabled: true
    auto_recovery_enabled: false  # Disable for racing safety
    emergency_timeout: 5.0  # s - Time before auto-recovery (if enabled)
    
    # Performance Monitoring
    performance_monitoring: true
    max_cpu_usage: 15.0  # % - Monitor computational load
    max_memory_usage: 100.0  # MB - Memory monitoring
    
    # Logging and Debugging
    debug_mode: false
    verbose_logging: false
    log_warnings: true
    log_sensor_data: false  # Disable for performance
    
    # Integration Settings
    publish_tf: false  # Usually handled by other nodes
    use_sim_time: false  # Set to true for simulation
    namespace: ""  # Robot namespace if needed